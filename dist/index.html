<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, height=device-height, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#0e1016">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="description" content="Brawl Bots: gunslingers and ninja clans fight it out on four maps - team plans, supers vs minions, and an AI you can rewrite as rules. Godot 4.">
		<title>Brawl Bots</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* -- back to apps (shared snippet - keep identical across apps) -- */
.back-to-apps{display:inline-flex;align-items:center;gap:.4em;padding:6px 12px;border-radius:999px;
	font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.02em;
	text-decoration:none;white-space:nowrap;color:#f2f4f8;background:rgba(12,14,20,.72);
	border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.back-to-apps:hover{background:rgba(12,14,20,.92);border-color:rgba(255,255,255,.62);color:#fff}
.back-to-apps:focus-visible{outline:2px solid #7fd1ff;outline-offset:2px}
.back-to-apps-row{margin:0 0 10px;text-align:left}
.back-to-apps--pill{position:fixed;top:10px;left:10px;z-index:2147483000;box-shadow:0 2px 8px rgba(0,0,0,.4)}
@media (max-width:520px){.back-to-apps--pill{top:8px;left:8px}}


#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-loading {
	position: absolute;
	bottom: 6%;
	left: 0;
	right: 0;
	text-align: center;
	color: #8b94a6;
	font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* the AI rules editor: a real textarea over the canvas, so phones get their own keyboard */
#brawl-editor { position: fixed; inset: 0; display: none; z-index: 50; background: rgba(12,9,7,0.94); color: #eee3cf;
	font: 14px/1.4 system-ui, sans-serif; padding: max(54px, env(safe-area-inset-top)) 14px 14px; box-sizing: border-box;
	flex-direction: column; gap: 8px; touch-action: auto; }
#brawl-editor.open { display: flex; }
#brawl-editor h2 { margin: 0; font-size: 18px; color: #ffd98a; }
#brawl-editor .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#brawl-editor textarea { flex: 1 1 auto; min-height: 30vh; width: 100%; box-sizing: border-box; background: #1b1511; color: #f4ead6;
	border: 1px solid #7a5a34; border-radius: 6px; padding: 8px; font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; resize: none; }
#brawl-editor button, #brawl-editor select { background: #3a2a1a; color: #f4ead6; border: 1px solid #8a6a40; border-radius: 6px;
	padding: 8px 12px; font-size: 15px; }
#brawl-editor button.go { background: #4a6a2a; border-color: #8ab060; }
#brawl-editor #be-msg { min-height: 1.2em; white-space: pre-wrap; font-size: 13px; }
#brawl-editor #be-msg.bad { color: #ff9a80; }
#brawl-editor #be-msg.good { color: #a6e88a; }
#brawl-editor details { max-height: 32vh; overflow: auto; background: #15100c; border-radius: 6px; padding: 4px 8px; }
#brawl-editor pre { margin: 0; font-size: 12px; white-space: pre-wrap; color: #d9cfbb; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<!--
		  Back to apps: the shared snippet from hub-orchestrator/snippets, as a
		  plain anchor rather than an in-engine button calling OS.shell_open.
		  It is then a real link - middle-click, long-press, "open in new tab"
		  and the browser's own back button all behave - and it is on screen
		  while the WASM module is still downloading. The Godot UI keeps its
		  top-left corner clear for it.
		-->
		<a class="back-to-apps back-to-apps--pill" href="https://apps.precogsoftwareservices.com">&#8592; Apps</a>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-loading">Loading Brawl Bots&#8230;</div>
			<div id="status-notice"></div>
		</div>

		<div id="brawl-editor">
			<h2 id="be-title">AI rules</h2>
			<div class="row"><label>Start from: <select id="be-preset"></select></label></div>
			<textarea id="be-text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
			<div id="be-msg"></div>
			<div class="row">
				<button id="be-check">Check</button>
				<button id="be-apply" class="go">Apply to this side</button>
				<button id="be-cancel">Cancel</button>
			</div>
			<details><summary>What can I write?</summary><pre id="be-help"></pre></details>
		</div>
		<script>
		// The game asks us to open; we queue Check / Apply / Cancel for it to poll, and it replies.
		window.brawlEditor = (function () {
			var el = document.getElementById('brawl-editor'), ta = document.getElementById('be-text');
			var msg = document.getElementById('be-msg'), sel = document.getElementById('be-preset');
			var queue = [], team = 0, presets = {};
			function send(action) { queue.push(JSON.stringify({action: action, team: team, text: ta.value})); }
			document.getElementById('be-check').onclick = function () { msg.className = ''; msg.textContent = 'Checking...'; send('check'); };
			document.getElementById('be-apply').onclick = function () { msg.className = ''; msg.textContent = 'Applying...'; send('apply'); };
			document.getElementById('be-cancel').onclick = function () { el.classList.remove('open'); send('cancel'); };
			sel.onchange = function () { if (presets[sel.value] !== undefined) { ta.value = presets[sel.value]; } };
			['keydown', 'keyup', 'keypress'].forEach(function (k) { el.addEventListener(k, function (e) { e.stopPropagation(); }, true); });
			return {
				open: function (t, title, text, help, ps) {
					team = t; presets = ps || {};
					document.getElementById('be-title').textContent = title;
					document.getElementById('be-help').textContent = help;
					sel.innerHTML = '<option value="">(your rules)</option>';
					Object.keys(presets).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
					ta.value = text; msg.textContent = ''; msg.className = '';
					el.classList.add('open'); setTimeout(function () { ta.focus(); }, 50);
				},
				poll: function () { return queue.length ? queue.shift() : ''; },
				reply: function (r) {
					msg.className = r.ok ? 'good' : 'bad';
					msg.textContent = r.ok ? r.summary : r.errors;
					if (r.close) { setTimeout(function () { el.classList.remove('open'); }, 700); }
				}
			};
		})();
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":480500,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			document.getElementById('status-loading')?.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
